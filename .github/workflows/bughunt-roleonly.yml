name: bughunt (V6)

# Full-stack / real reproductions of the unreported v6 bugs, each uploading raw logs as an
# artifact. A RED job = the bug reproduced. No local docker involved — all on GHA runners.
#   roleonly (V6-A): full testenv stack; a host emits a role-only first token then hangs ->
#                    the gateway neither escalates nor fails closed (stalls to InferenceTimeout).
#   purge    (V6-B): a REAL Postgres (testcontainers); PurgeEpoch doesn't record the deletion,
#                    so the purged epoch's ledger resurrects from Postgres on reload.
#   repair   (V6-C): two REAL Host instances exchange a real repair request/response; a multi-slot
#                    responder attributes the courtesy ack to its PrimarySlot, not the probed slot,
#                    so the probed (non-primary) slot never repairs.

on:
  push:
    branches:
      - dbogdan/v6-bughunt-roleonly-citest
  workflow_dispatch: {}

jobs:
  roleonly:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./devshard/testenv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
          cache-dependency-path: devshard/go.sum
      - name: Build linux devshardd
        run: make build-devshardd
      - name: Run citest-bughunt-roleonly (raw log teed for proof)
        run: |
          mkdir -p /tmp/proof
          set -o pipefail
          make citest-bughunt-roleonly 2>&1 | tee /tmp/proof/roleonly.log
      - name: Upload roleonly raw proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bughunt-roleonly-proof
          path: /tmp/proof/

  purge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./devshard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
          cache-dependency-path: devshard/go.sum
      - name: Run V6-B purge PG-testcontainers test (raw log teed for proof)
        run: |
          mkdir -p /tmp/proof
          set -o pipefail
          go test ./accounting/ -run '^TestBugHunt_V6_PurgeEpochResurrectsFromPostgresOnReload$' -count=1 -v 2>&1 | tee /tmp/proof/purge.log
      - name: Upload purge raw proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bughunt-purge-proof
          path: /tmp/proof/

  repair:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./devshard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
          cache-dependency-path: devshard/go.sum
      - name: Run V6-C two-Host repair-exchange test (raw log teed for proof)
        run: |
          mkdir -p /tmp/proof
          set -o pipefail
          go test ./host/ -run '^TestBugHunt_V6_RepairExchange_NonPrimarySlotNeverRepairs$' -count=1 -v 2>&1 | tee /tmp/proof/repair.log
      - name: Upload repair raw proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bughunt-repair-proof
          path: /tmp/proof/

  # --- Round 2 (fresh dimensions, known defects excluded) ---
  #   selfvalidation (V6-D): a multi-slot executor validates its OWN challenged inference from a
  #                          sibling slot -> real StateMachine ApplyDiff path marks it Validated.
  #   turndegrade    (V6-E): one over-stated ack folded first prematurely degrades a turn a later
  #                          honest quorum would complete -> real TurnTracker, order-dependent.
  #   rotatororphan  (V6-F): a rotator settle failing after SetDevshardActive(false) leaves the
  #                          escrow invisible to every recovery path -> real SQLite store.
  selfvalidation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./devshard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
          cache-dependency-path: devshard/go.sum
      - name: Run V6-D executor self-validation test (raw log teed for proof)
        run: |
          mkdir -p /tmp/proof
          set -o pipefail
          go test ./state/ -run '^TestBugHunt_V6_ExecutorSelfValidatesViaSiblingSlot$' -count=1 -v 2>&1 | tee /tmp/proof/selfvalidation.log
      - name: Upload selfvalidation raw proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bughunt-selfvalidation-proof
          path: /tmp/proof/

  turndegrade:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./devshard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
          cache-dependency-path: devshard/go.sum
      - name: Run V6-E premature turn-degrade test (raw log teed for proof)
        run: |
          mkdir -p /tmp/proof
          set -o pipefail
          go test ./heightsync/ -run '^TestBugHunt_V6_OverstatedAckPrematurelyDegradesTurn$' -count=1 -v 2>&1 | tee /tmp/proof/turndegrade.log
      - name: Upload turndegrade raw proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bughunt-turndegrade-proof
          path: /tmp/proof/

  rotatororphan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./devshard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
          cache-dependency-path: devshard/go.sum
      - name: Run V6-F rotator-orphan test (raw log teed for proof)
        run: |
          mkdir -p /tmp/proof
          set -o pipefail
          go test ./cmd/devshardctl/ -run '^TestBugHunt_V6_RotatorSettleFailureOrphansEscrow$' -count=1 -v 2>&1 | tee /tmp/proof/rotatororphan.log
      - name: Upload rotatororphan raw proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bughunt-rotatororphan-proof
          path: /tmp/proof/

  # --- Round 3 ---
  #   challengestuck (V6-G): a single Phase-A invalid validation of weight > VoteThreshold opens a
  #     challenge that never resolves (Finished->Challenged branch skips resolveChallengeTallies),
  #     so the inference seals Challenged and the client is never refunded -> real StateMachine.
  challengestuck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./devshard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
          cache-dependency-path: devshard/go.sum
      - name: Run V6-G stuck-challenge no-refund test (raw log teed for proof)
        run: |
          mkdir -p /tmp/proof
          set -o pipefail
          go test ./state/ -run '^TestBugHunt_V6_FinishedToChallengedNeverResolvesLosesRefund$' -count=1 -v 2>&1 | tee /tmp/proof/challengestuck.log
      - name: Upload challengestuck raw proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bughunt-challengestuck-proof
          path: /tmp/proof/
