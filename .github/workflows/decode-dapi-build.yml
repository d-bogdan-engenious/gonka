name: decode v0.2.17 dapi binary
# Builds the decode-aware v0.2.17 dapi (decentralized-api) musl binary from c4d441052, for the
# in-place dapi upgrade on tn3 (the chain freezes DECODE recipes but the v0.2.16 dapi is not
# decode-aware and keeps instructing the mlnode to do prefill).
on:
  workflow_dispatch:
  push:
    branches: [decode-dapi]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
      - name: Build dapi upgrade zip (musl, linux/amd64)
        run: |
          mkdir -p public-html/v2/dapi
          make -C decentralized-api build-for-upgrade PLATFORM=linux/amd64 GOOS=linux GOARCH=amd64
          ls -la public-html/v2/dapi; sha256sum public-html/v2/dapi/*.zip
      - name: Verify dapi is decode-aware
        run: |
          cd public-html/v2/dapi
          unzip -o decentralized-api-amd64.zip -d _x >/dev/null
          BIN=$(find _x -type f -name decentralized-api | head -1)
          echo "binary: $BIN size=$(stat -c%s "$BIN")"
          N=$(grep -a -c 'POC_SCHEME_DECODE' "$BIN" || true); echo "POC_SCHEME_DECODE=$N"
          test "$N" -ge 1 || { echo "::error::dapi not decode-aware"; exit 1; }
          echo "OK: dapi decode-aware"; rm -rf _x
      - uses: actions/upload-artifact@v4
        with:
          name: decode-dapi-v0217
          path: public-html/v2/dapi/decentralized-api-amd64.zip
          retention-days: 5
