name: QA-109 floor publish to release
on: { workflow_dispatch: {}, push: { branches: [decode-publish] } }
permissions: { contents: write, actions: read }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download floor artifact + upload to release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p f
          gh run download 42659345930 -R ${{ github.repository }} -n qa109-floor-inferenced -D f
          cp f/inferenced-amd64.zip inferenced-floor.zip
          sha256sum inferenced-floor.zip
          gh release upload gon593-bins -R ${{ github.repository }} inferenced-floor.zip --clobber
          echo "ASSET=https://github.com/${{ github.repository }}/releases/download/gon593-bins/inferenced-floor.zip"
