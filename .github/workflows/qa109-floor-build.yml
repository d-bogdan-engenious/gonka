name: QA-109 floor binary
on:
  workflow_dispatch:
  push:
    branches: [qa109-floor, qa109-floor2]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-go@v5
        with: { go-version: '1.24.2' }
      - name: Build inferenced upgrade zip
        run: |
          mkdir -p public-html/v2/inferenced
          make -C inference-chain build-for-upgrade PLATFORM=linux/amd64 GOOS=linux GOARCH=amd64
          sha256sum public-html/v2/inferenced/*.zip
      - name: Verify floor + replay handlers baked in
        run: |
          cd public-html/v2/inferenced
          unzip -o inferenced-amd64.zip -d _x >/dev/null
          BIN=$(find _x -type f -name inferenced | head -1)
          for s in 'v0.2.17-floor2' 'v0.2.17-floor' 'v0.2.17-decode' 'v0.2.17-g593a' 'min_epoch_acceptance_weight'; do
            n=$(grep -a -c "$s" "$BIN" || true); echo "$s=$n"; test "$n" -ge 1 || { echo "::error::missing $s"; exit 1; }
          done
          echo OK; rm -rf _x
      - uses: actions/upload-artifact@v4
        with:
          name: qa109-floor2-inferenced
          path: public-html/v2/inferenced/inferenced-amd64.zip
          retention-days: 5
